services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: glaces
      POSTGRES_PASSWORD: glaces
      POSTGRES_DB: glaces
    ports:
      - "5433:5432"

  dbt:
    image: ghcr.io/dbt-labs/dbt-postgres:1.8.2
    working_dir: /usr/app
    environment:
      DBT_PROFILES_DIR: /usr/app
    volumes:
      - ./:/usr/app
    depends_on:
      - postgres

  adminer:
    image: adminer:latest
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "8080:8080"
    depends_on:
      - postgres

  docs:
    image: ghcr.io/dbt-labs/dbt-postgres:1.8.2
    working_dir: /usr/app
    environment:
      DBT_PROFILES_DIR: /usr/app
    volumes:
      - ./:/usr/app
    entrypoint: ["sh", "-c", "dbt docs generate && dbt docs serve --host 0.0.0.0 --port 8081"]
    ports:
      - "8081:8081"
    depends_on:
      - postgres